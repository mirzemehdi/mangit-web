<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Sora"; src: url("assets/fonts/sora-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "MangitLensLetter"; src: url("assets/fonts/baloo-2-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      :root {
        --ground: #0b0c0f;
        --ink: #eef0f3;
        --ink-2: #a0a6b1;
        --device: #3fe0ff;
        --cloud: #ffc15e;
        --font-display: "Sora", "Inter", sans-serif;
        --font-body: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-body); color: var(--ink); }
      #bg { position: absolute; inset: 0; background: var(--ground); }
    </style>
  </head>
